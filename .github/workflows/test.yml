name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (ExUnit + SurrealDB)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      SURREAL_URL: http://127.0.0.1:8000
      SURREAL_USER: root
      SURREAL_PASS: root

    steps:
      - uses: actions/checkout@v4

      # SurrealDB nejde spustit přes `services:`. Obraz má entrypoint
      # `/surreal` a bez podpříkazu jen vypíše nápovědu a skončí; služby
      # v Actions přitom argumenty předat neumí, takže se kontejner vždy
      # vyhodnotil jako unhealthy a job spadl na „One or more containers
      # failed to start". Spouštíme ji proto krokem, kde `start` předat lze.
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:v3.0.0 \
            start --user root --pass root --bind 0.0.0.0:8000 memory
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "SurrealDB je připravená po ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "SurrealDB nenaběhla do 30s, log kontejneru:"
          docker logs surrealdb
          exit 1

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            apps/api/deps
            apps/api/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install deps
        working-directory: apps/api
        run: mix deps.get

      - name: Compile (warnings are errors)
        working-directory: apps/api
        run: mix compile --warnings-as-errors

      # Včetně DB testů — SurrealDB běží v kontejneru z kroku výš.
      - name: Test
        working-directory: apps/api
        run: mix test --include db

  web:
    name: Web (typecheck, vitest, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build
